<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Category standard</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:440px;height:956px;overflow:hidden;background:#F2F2F7;color:#1C1C1E;font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;padding:68px 20px 44px;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;min-height:64px}
h1{font-size:36px;font-weight:700}
.gear{width:60px;height:60px;border-radius:50%;background:#E5E5EA;display:grid;place-items:center}
.card{background:#fff;border-radius:20px;padding:22px;margin-top:20px}
.lbl{font-size:24px;font-weight:600}
.dots{display:flex;gap:12px;margin:16px 0 12px}
.d{width:44px;height:44px;border-radius:50%;border:3px solid #0A66D6;display:grid;place-items:center}
.d.on{background:#0A66D6}
.big{font-size:30px;font-weight:700}
.start{margin-top:auto;height:136px;border-radius:20px;background:#0A66D6;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.start b{font-size:38px;font-weight:700;line-height:1.15}
.start i{font-style:normal;font-size:23px}
.row{display:flex;justify-content:space-between;font-size:24px;padding:10px 0}
.row b{font-weight:700}
</style></head><body>
<header><h1>Chào buổi sáng</h1><div class="gear" aria-label="Cài đặt"><svg width="30" height="30" viewBox="0 0 24 24" fill="#1C1C1E"><path d="M4 7h16v2.600H4zM4 14.400h16V17H4z"/><circle cx="9" cy="8.300" r="3"/><circle cx="16" cy="15.700" r="3"/></svg></div></header>
<section class="card"><div class="lbl">Tuần này</div>
<div class="dots"><div class="d on"></div><div class="d on"></div><div class="d on"></div><div class="d"></div><div class="d"></div></div>
<div class="big">3 trên 5 ngày</div></section>
<section class="card"><div class="row"><span>Tuần này</span><b>32 phút</b></div><div class="row"><span>Kỷ lục mới</span><b>Tốc độ</b></div></section>
<div class="start" role="button"><b>Bắt đầu bài hôm nay</b><i>khoảng 10 phút</i></div>
</body></html>
